name: Build PrettyWSL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build configuration'
        type: choice
        default: 'Release'
        options: [Debug, Release]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'Release' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Setup VS2022
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: 17.11

      - name: Configure CMake
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_SYSTEM_VERSION=10.0.26100.0 -DTARGET_PLATFORM=x64 -DWSL_BUILD_WSL_SETTINGS=true -DSKIP_PACKAGE_SIGNING=true "-DWSL_DEV_BINARY_PATH=" "-DPACKAGE_VERSION=2026.6.2.0" "-DWSL_NUGET_PACKAGE_VERSION=2026.6.2-build001"
        shell: powershell

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}
        shell: powershell

      - name: List build artifacts
        run: Get-ChildItem -Recurse -LiteralPath "build/bin/x64/${{ env.BUILD_TYPE }}" | Select-Object FullName, Length
        shell: powershell

      - uses: actions/upload-artifact@v4
        with:
          name: prettywsl-x64-${{ env.BUILD_TYPE }}
          path: build/bin/x64/${{ env.BUILD_TYPE }}/
          retention-days: 7


